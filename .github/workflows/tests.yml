name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Check lint and formatting
        run: npm run check

  test:
    name: Test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-changes
          - bb-plugin-code-cleanup
          - bb-plugin-codex-inspired
          - bb-plugin-codex-quota
          - bb-plugin-compose-chat
          - bb-plugin-github-insight
          - bb-plugin-markdown-reader
          - bb-plugin-pr-thread-list
          - bb-plugin-tasks-plus
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json

      - name: Install SQLite CLI
        id: install_sqlite
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          sqlite3 --version

      - name: Install dependencies
        id: install_dependencies
        run: npm ci

      - name: Lint Tasks Plus
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: npm run lint

      - name: Install PR thread list integration dependencies
        id: install_pr_thread_list
        if: matrix.plugin == 'bb-plugin-github-insight'
        run: npm ci --prefix ../bb-plugin-pr-thread-list

      # Run both checks after successful setup, even if lint or tests fail.
      - name: Run tests
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-github-insight' || steps.install_pr_thread_list.outcome == 'success')
          }}
        run: npm test

      - name: Run typecheck
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-github-insight' || steps.install_pr_thread_list.outcome == 'success')
          }}
        run: |
          if [ ! -x node_modules/.bin/tsc ]; then
            echo "::error::Missing locked local TypeScript compiler: node_modules/.bin/tsc"
            exit 1
          fi
          npm run typecheck
