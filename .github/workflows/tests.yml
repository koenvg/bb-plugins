name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install tooling
        run: bun install --frozen-lockfile

      - name: Check lint and formatting
        run: bun run check

  test:
    name: Test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-changes
          - bb-plugin-code-cleanup
          - bb-plugin-codex-inspired
          - bb-plugin-codex-quota
          - bb-plugin-compose-chat
          - bb-plugin-github-insight
          - bb-plugin-live-output
          - bb-plugin-markdown-reader
          - bb-plugin-mcp
          - bb-plugin-pr-thread-list
          - bb-plugin-pi-subagents-provider
          - bb-plugin-tasks-plus
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest/jsdom and native SQLite checks require Node.
      - name: Set up Node.js for Vitest
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"

      - name: Set up Bun
        id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install SQLite CLI
        id: install_sqlite
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          sqlite3 --version

      - name: Install dependencies
        id: install_dependencies
        run: |
          bun install --frozen-lockfile

      - name: Check Quota installed glob dependencies
        if: matrix.plugin == 'bb-plugin-codex-quota'
        run: bun run check:installed-globs

      - name: Install Tasks navigation lab dependencies
        id: install_tasks_navigation_lab
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: bun install --cwd ../bb-plugin-codex-quota --frozen-lockfile

      - name: Lint Tasks Plus
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: bun run lint

      - name: Install PR thread list integration dependencies
        id: install_pr_thread_list
        if: matrix.plugin == 'bb-plugin-github-insight'
        run: bun install --cwd ../bb-plugin-pr-thread-list --frozen-lockfile

      # Run both checks after successful setup, even if lint or tests fail.
      - name: Run tests
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_tasks_navigation_lab.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-github-insight' || steps.install_pr_thread_list.outcome == 'success')
          }}
        run: bun run test

      - name: Run typecheck
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_tasks_navigation_lab.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-github-insight' || steps.install_pr_thread_list.outcome == 'success')
          }}
        run: |
          if [ ! -x node_modules/.bin/tsc ]; then
            echo "::error::Missing locked local TypeScript compiler: node_modules/.bin/tsc"
            exit 1
          fi
          bun run typecheck

      - name: Build MCP package
        if: >-
          ${{
            !cancelled() &&
            matrix.plugin == 'bb-plugin-mcp' &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success'
          }}
        run: bun run build

  browser:
    name: Browser test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-compose-chat
          - bb-plugin-markdown-reader
          - bb-plugin-codex-quota
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: bun --bun run playwright install --with-deps chromium

      - name: Run browser tests
        run: bun run test:browser

      - name: Save browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.plugin }}
          path: |
            ${{ matrix.plugin }}/playwright-report/
            ${{ matrix.plugin }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
