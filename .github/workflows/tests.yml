name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Root tests, lint, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=26.0.0 <27"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install workspace dependencies and build shared Markdown
        run: bash .bb-env-setup.sh

      - name: Check root tests, lint, and formatting
        run: bun run check

  test:
    name: Test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-browser-annotate
          - bb-plugin-changes
          - bb-plugin-code-cleanup
          - bb-plugin-codex-inspired
          - bb-plugin-codex-quota
          - bb-plugin-compose-chat
          - bb-plugin-github-insight
          - bb-plugin-live-output
          - bb-plugin-markdown-reader
          - bb-plugin-mcp
          - bb-plugin-pr-thread-list
          - bb-plugin-pi-subagents-provider
          - bb-plugin-tasks-plus
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest/jsdom and native SQLite checks require Node.
      - name: Set up Node.js for Vitest
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=26.0.0 <27"

      - name: Set up Bun
        id: setup_bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Tasks native build prerequisites
        id: install_sqlite
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3 build-essential python3
          sqlite3 --version

      - name: Install workspace dependencies and build shared Markdown
        id: install_dependencies
        working-directory: .
        run: bash .bb-env-setup.sh

      - name: Verify shared Markdown for document consumers
        id: shared_markdown
        if: matrix.plugin == 'bb-plugin-tasks-plus' || matrix.plugin == 'bb-plugin-markdown-reader'
        working-directory: packages/markdown-document
        run: |
          bun run test --maxWorkers=1
          bun run typecheck

      - name: Check Quota installed glob dependencies
        if: matrix.plugin == 'bb-plugin-codex-quota'
        run: bun run check:installed-globs

      - name: Lint Tasks Plus
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        run: bun run lint

      # Run both checks after successful setup, even if lint or tests fail.
      - name: Run tests
        id: tests
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            ((matrix.plugin != 'bb-plugin-tasks-plus' && matrix.plugin != 'bb-plugin-markdown-reader') || steps.shared_markdown.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success')
          }}
        run: bun run test ${{ (matrix.plugin == 'bb-plugin-tasks-plus' || matrix.plugin == 'bb-plugin-markdown-reader') && '--maxWorkers=1' || '' }}

      - name: Run typecheck
        id: typecheck
        if: >-
          ${{
            !cancelled() &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success' &&
            ((matrix.plugin != 'bb-plugin-tasks-plus' && matrix.plugin != 'bb-plugin-markdown-reader') || steps.shared_markdown.outcome == 'success') &&
            (matrix.plugin != 'bb-plugin-tasks-plus' || steps.install_sqlite.outcome == 'success')
          }}
        run: |
          if [ ! -x node_modules/.bin/tsc ]; then
            echo "::error::Missing locked local TypeScript compiler: node_modules/.bin/tsc"
            exit 1
          fi
          bun run typecheck

      - name: Check MCP SDK alignment
        if: >-
          ${{
            !cancelled() &&
            matrix.plugin == 'bb-plugin-mcp' &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success'
          }}
        run: bun run check:sdk

      - name: Build MCP package
        if: >-
          ${{
            !cancelled() &&
            matrix.plugin == 'bb-plugin-mcp' &&
            steps.checkout.outcome == 'success' &&
            steps.setup_bun.outcome == 'success' &&
            steps.setup_node.outcome == 'success' &&
            steps.install_dependencies.outcome == 'success'
          }}
        run: bun run build
      - name: Verify document consumer official build tooling
        id: document_sdk
        if: (matrix.plugin == 'bb-plugin-tasks-plus' || matrix.plugin == 'bb-plugin-markdown-reader') && steps.shared_markdown.outcome == 'success' && steps.tests.outcome == 'success' && steps.typecheck.outcome == 'success'
        env:
          BB_DATA_DIR: ${{ runner.temp }}/bbp57-${{ matrix.plugin }}-build-data
        run: |
          test "$(node_modules/.bin/bb --version)" = "0.46.1"
          node_modules/.bin/bb plugin types . --check
      - name: Build document consumer plugin
        if: (matrix.plugin == 'bb-plugin-tasks-plus' || matrix.plugin == 'bb-plugin-markdown-reader') && steps.shared_markdown.outcome == 'success' && steps.tests.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.document_sdk.outcome == 'success'
        env:
          BB_DATA_DIR: ${{ runner.temp }}/bbp57-${{ matrix.plugin }}-build-data
        run: bun run build

  browser:
    name: Browser test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - bb-plugin-compose-chat
          - bb-plugin-markdown-reader
          - bb-plugin-codex-quota
          - bb-plugin-tasks-plus
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js for browser checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=26.0.0 <27"

      - name: Install workspace dependencies and build shared Markdown
        working-directory: .
        run: bash .bb-env-setup.sh

      - name: Verify shared Markdown for document consumers
        if: matrix.plugin == 'bb-plugin-tasks-plus' || matrix.plugin == 'bb-plugin-markdown-reader'
        working-directory: packages/markdown-document
        run: |
          bun run test --maxWorkers=1
          bun run typecheck

      - name: Check Tasks fixture ownership and shutdown
        if: matrix.plugin == 'bb-plugin-tasks-plus'
        working-directory: .
        env:
          BBP53_CAPTURE_PHASE: none
        run: bun test scripts/browser-fixture-runner.test.mjs scripts/browser-preview-servers.test.mjs --test-name-pattern 'tasks-plus|runner|config accepts|package command'

      - name: Install Chromium and system dependencies
        run: bun --bun run playwright install --with-deps chromium

      - name: Run browser tests
        env:
          BBP53_CAPTURE_PHASE: none
        run: bun run test:browser

      - name: Save browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.plugin }}
          path: |
            ${{ matrix.plugin }}/playwright-report/
            ${{ matrix.plugin }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
