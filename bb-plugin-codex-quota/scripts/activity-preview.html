<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BBP-24 synthetic activity preview</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    :root {
      --background: #161616;
      --foreground: #ededed;
      --muted: #282828;
      --border: #3a3a3a;
      --muted-foreground: #b5b5b5;
      --accent: #282828;
      --primary: #a8c7fa;
      --destructive: #ff8b8b;
      --ring: #a8c7fa;
      --radius: 0.5rem;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui;
    }
    h1,
    h2,
    h3,
    p,
    dl,
    dd {
      margin: 0;
    }
    ul {
      padding: 0;
      list-style: none;
    }
    button,
    select {
      font: inherit;
    }
    table {
      border-collapse: collapse;
    }
    #root {
      min-height: 100vh;
    }
  </style>
  <div id="root" data-bb-plugin="codex-quota"></div>
  <script type="module" src="activity-preview.js"></script>
</html>
