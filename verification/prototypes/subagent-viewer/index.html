<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subagent viewer prototype</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff;
        --foreground: #292929;
        --muted-foreground: #626262;
        --sidebar: #f6f6f6;
        --surface: #f3f3f3;
        --border: #dedede;
        --hover: #ededed;
        --selected: #e8e8e8;
        --success: #28734a;
        --attention: #805b12;
        --destructive: #af302e;
        --warning-surface: #faf5e9;
        --ring: #555;
        --radius: 6px;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #202020;
        --foreground: #e8e8e8;
        --muted-foreground: #aaa;
        --sidebar: #1a1a1a;
        --surface: #292929;
        --border: #3b3b3b;
        --hover: #303030;
        --selected: #353535;
        --success: #82c49a;
        --attention: #dec17b;
        --destructive: #f19491;
        --warning-surface: #302b20;
        --ring: #bbb;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--sidebar);
        color: var(--foreground);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button,
      select,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--selected);
        color: var(--foreground);
      }
      button:active:not(:disabled) {
        background: var(--selected);
      }
      svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-size: 13px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .number {
        font-variant-numeric: tabular-nums;
      }
      .prototype-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }
      .prototype-description {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      .prototype-description span {
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .controls {
        display: flex;
        min-width: 0;
        max-width: 100%;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .controls label {
        display: flex;
        min-width: 0;
        max-width: 100%;
        align-items: center;
        gap: 6px;
      }
      .controls select,
      .button {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--background);
        min-width: 0;
        min-height: 32px;
        padding: 4px 10px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .button:hover:not(:disabled),
      select:hover {
        background: var(--hover);
      }
      .button[aria-pressed="true"] {
        background: var(--selected);
      }
      .viewer:focus-visible {
        outline-offset: -2px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(360px, 480px);
        flex: 1;
        width: 100%;
        min-height: 0;
        max-width: 1400px;
        margin: 0 auto;
        background: var(--background);
      }
      .workspace[data-width="wide"] {
        grid-template-columns: minmax(260px, 1fr) minmax(360px, 600px);
      }
      .workspace[data-width="panel"] {
        display: block;
        max-width: 520px;
      }
      .workspace[data-width="panel"] .parent-thread {
        display: none;
      }
      .parent-thread {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .thread-header,
      .panel-header {
        flex-shrink: 0;
        min-height: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }
      .thread-header > div {
        min-width: 0;
      }
      .thread-header h2 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .parent-meta {
        color: var(--muted-foreground);
        font-size: 11px;
        margin-top: 2px;
      }
      .parent-content {
        overflow-y: auto;
        padding: 28px 28px 40px;
      }
      .parent-content .conversation {
        max-width: 680px;
        margin: auto;
      }
      .parent-footer {
        margin-top: auto;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .viewer {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
        border-left: 1px solid var(--border);
      }
      .panel-header {
        padding: 12px 16px;
        flex-wrap: wrap;
      }
      .panel-tabs {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .panel-tabs span {
        color: var(--muted-foreground);
      }
      .panel-tabs strong {
        font-weight: 600;
      }
      .readonly {
        font-size: 11px;
        color: var(--muted-foreground);
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .readonly svg {
        width: 12px;
        height: 12px;
      }
      .run-picker {
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .run-picker > summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        cursor: pointer;
        list-style: none;
        font-weight: 500;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .run-picker > summary .chevron {
        transition: transform 150ms ease-out;
      }
      .run-picker[open] > summary .chevron,
      .tool[open] > summary .chevron,
      .snapshot-footer[open] > summary .chevron {
        transform: rotate(90deg);
      }
      .run-count {
        font-size: 11px;
        color: var(--muted-foreground);
        margin-left: 8px;
        font-weight: 400;
      }
      .run-list {
        list-style: none;
        margin: 0;
        padding: 0 8px 8px;
        max-height: 218px;
        overflow-y: auto;
      }
      .run-button {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px 8px;
        width: 100%;
        min-height: 54px;
        text-align: left;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
      }
      .run-button:hover {
        background: var(--hover);
      }
      .run-button[aria-pressed="true"] {
        background: var(--selected);
      }
      .run-button .state-mark {
        padding-top: 3px;
      }
      .run-name {
        font-weight: 500;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .run-meta {
        display: block;
        font-size: 11px;
        color: var(--muted-foreground);
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .run-status {
        font-size: 11px;
        text-align: right;
        white-space: nowrap;
      }
      .run-time {
        display: block;
        color: var(--muted-foreground);
        margin-top: 2px;
      }
      .complete {
        color: var(--success);
      }
      .running,
      .partial {
        color: var(--attention);
      }
      .failed {
        color: var(--destructive);
      }
      .detail-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .detail-title {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .detail-title h2 {
        font-size: 14px;
      }
      .state-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
      .state-label svg {
        width: 14px;
        height: 14px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr));
        gap: 20px;
        margin: 12px 0 0;
      }
      .metrics dt {
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .metrics dd {
        margin: 3px 0 0;
        font-size: 13px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .metrics small {
        font-weight: 400;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .notice {
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--warning-surface);
        color: var(--foreground);
        font-size: 12px;
      }
      .notice strong {
        font-weight: 600;
      }
      .conversation-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 16px;
        flex-shrink: 0;
      }
      .conversation-toolbar h3 {
        font-size: 12px;
        font-weight: 500;
      }
      .conversation-toolbar .button {
        min-height: 28px;
        border: 0;
        font-size: 11px;
        padding: 4px 6px;
      }
      .transcript {
        overflow-y: auto;
        flex: 1 0 200px;
        min-height: 200px;
        padding: 10px 20px 32px;
        scroll-behavior: smooth;
      }
      .conversation {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .message {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .message.user {
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
      }
      .message-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 7px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .message-meta strong {
        font-weight: 500;
        color: var(--foreground);
      }
      .message-body {
        line-height: 1.65;
      }
      .message-body p + p {
        margin-top: 10px;
      }
      .message-body ul {
        margin: 10px 0;
        padding-left: 20px;
      }
      .message-body h3 {
        margin: 16px 0 6px;
      }
      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      code {
        background: var(--surface);
        border-radius: 3px;
        padding: 1px 4px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        margin: 10px 0 0;
        line-height: 1.65;
      }
      .tool {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--background);
      }
      .tool > summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        list-style: none;
        min-height: 36px;
        padding: 8px 10px;
        cursor: pointer;
        color: var(--muted-foreground);
        font-size: 12px;
      }
      .tool > summary:hover {
        background: var(--hover);
      }
      .tool > summary > span {
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      .tool .tool-name {
        color: var(--foreground);
        font-weight: 500;
      }
      .tool .tool-time {
        margin-left: auto;
        font-size: 11px;
      }
      .tool-content {
        padding: 0 10px 10px;
      }
      .final-caption {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--success);
        font-size: 11px;
        margin-bottom: 8px;
      }
      .final-caption svg {
        width: 14px;
        height: 14px;
      }
      .snapshot-footer {
        border-top: 1px solid var(--border);
        margin-top: 24px;
        padding: 12px 0;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .snapshot-footer > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        list-style: none;
        cursor: pointer;
      }
      .snapshot-footer[open] > summary {
        margin-bottom: 8px;
      }
      .snapshot-footer dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 4px 12px;
        margin: 0;
      }
      .snapshot-footer dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .state-content {
        padding: 28px 16px;
        color: var(--muted-foreground);
        line-height: 1.65;
      }
      .state-content h2 {
        color: var(--foreground);
        margin-bottom: 6px;
      }
      .skeleton {
        height: 12px;
        border-radius: 3px;
        background: var(--border);
        margin: 10px 0;
      }
      .loading-runs {
        height: 218px;
        padding: 12px 16px;
      }
      .loading-runs .skeleton {
        height: 35px;
      }
      @media (max-width: 760px) {
        .workspace,
        .workspace[data-width="wide"] {
          display: block;
          max-width: 600px;
        }
        .parent-thread {
          display: none;
        }
        .viewer {
          border-left: 0;
        }
        .prototype-bar {
          align-items: flex-start;
        }
        .prototype-description {
          flex-basis: 100%;
        }
        .controls {
          gap: 6px;
        }
        .prototype-description span {
          font-size: 11px;
        }
      }
      @media (max-width: 380px) {
        .run-picker > summary,
        .detail-header {
          padding-inline: 12px;
        }
        .transcript {
          padding-inline: 14px;
        }
        .metrics {
          gap: 10px;
        }
        .controls label {
          gap: 4px;
        }
      }
      @media (max-width: 760px) {
        .run-list {
          max-height: max(150px, 12em);
        }
      }
      @media (max-width: 760px) and (max-height: 740px) {
        .run-list {
          max-height: max(120px, 12em);
        }
      }
      .coverage-note {
        margin-top: 8px;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .transcript > .notice {
        margin-top: 0;
        margin-bottom: 16px;
      }
      @media (max-width: 400px) {
        .run-button {
          grid-template-columns: 16px minmax(0, 1fr);
        }
        .run-status {
          grid-column: 2;
          display: flex;
          flex-wrap: wrap;
          gap: 4px 8px;
          text-align: left;
        }
        .run-time {
          display: inline;
          margin-top: 0;
        }
      }
      @media (any-pointer: coarse) {
        .controls select,
        .button,
        .conversation-toolbar .button,
        .run-picker > summary,
        .tool > summary,
        .snapshot-footer > summary {
          min-width: 44px;
          min-height: 44px;
        }
        .controls select,
        .button,
        .conversation-toolbar .button,
        .message-body {
          font-size: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="prototype-bar">
      <div class="prototype-description">
        <h1>Subagent viewer</h1>
        <span>Prototype · Sample data · No live connection</span>
      </div>
      <div class="controls">
        <label
          >View
          <select id="width">
            <option value="workspace">Workspace</option>
            <option value="wide">Wide panel</option>
            <option value="panel">Panel only</option>
          </select></label
        >
        <label
          >Data
          <select id="scenario">
            <option value="captured">Captured runs</option>
            <option value="loading">Loading</option>
            <option value="empty">No runs</option>
            <option value="error">Capture error</option>
          </select></label
        >
        <button type="button" class="button" id="theme" aria-pressed="false">Dark theme</button>
      </div>
    </header>
    <main class="workspace" data-width="workspace" id="workspace">
      <section class="parent-thread" aria-label="Parent thread, sample context">
        <header class="thread-header">
          <div>
            <h2>Improve the subagent viewer</h2>
            <p class="parent-meta">Pi · GPT-5.4 · Sample parent thread</p>
          </div>
        </header>
        <div class="parent-content" id="parent-content"></div>
        <footer class="parent-footer">
          Sample thread context. The viewer on the right is read-only.
        </footer>
      </section>
      <aside class="viewer" tabindex="0" aria-label="Subagent viewer">
        <header class="panel-header">
          <div class="panel-tabs"><span>Changes</span><strong>Subagents</strong></div>
          <span class="readonly" id="readonly"></span>
        </header>
        <details class="run-picker" open id="run-picker">
          <summary>
            <span>Runs <span class="run-count" id="run-count"></span></span
            ><span id="picker-chevron"></span>
          </summary>
          <nav aria-label="Subagent runs">
            <ul class="run-list" id="run-list"></ul>
            <div id="list-state" hidden></div>
          </nav>
        </details>
        <div id="detail-header" class="detail-header"></div>
        <div class="conversation-toolbar" id="conversation-toolbar">
          <h3>Conversation</h3>
          <button type="button" class="button" id="jump">
            Final output <span id="jump-icon"></span>
          </button>
        </div>
        <div class="transcript" id="transcript" tabindex="0" aria-label="Captured conversation">
          <details class="snapshot-footer" id="snapshot-footer">
            <summary><span id="snapshot-label"></span><span id="snapshot-chevron"></span></summary>
            <dl id="capture-details"></dl>
          </details>
        </div>
      </aside>
    </main>
    <script>
      const paths = {
        chevron: '<path d="m6 3 5 5-5 5"/>',
        check: '<path d="m3 8 3 3 7-7"/>',
        clock: '<circle cx="8" cy="8" r="5.5"/><path d="M8 4.5V8l2 1.5"/>',
        error: '<circle cx="8" cy="8" r="5.5"/><path d="m6 6 4 4m0-4-4 4"/>',
        lock: '<rect x="4" y="7" width="8" height="6" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>',
        down: '<path d="M8 3v10m-4-4 4 4 4-4"/>',
        unknown:
          '<circle cx="8" cy="8" r="5.5"/><path d="M6.5 6a1.5 1.5 0 1 1 2 1.5L8 8.5M8 11h.01"/>',
      };
      const icon = (name) =>
        `<svg aria-hidden="true" viewBox="0 0 16 16" class="${name === "chevron" ? "chevron" : ""}">${paths[name]}</svg>`;
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const runs = [
        {
          id: "review-viewer",
          label: "Review viewer behavior",
          agent: "Reviewer",
          model: "GPT-5.4",
          provider: "OpenAI",
          state: "complete",
          status: "Complete",
          duration: "1m 42s",
          timing: "Total duration",
          capture: "Captured at 14:32:18",
          runId: "sample_review_01",
          task: "Review the proposed subagent viewer. Check model visibility, elapsed time, read-only behavior, and incomplete captures.",
          messages: [
            {
              role: "assistant",
              text: "I will check the run summary first, then the conversation and its capture limits.",
            },
            {
              kind: "tool",
              name: "read",
              subject: "subagents-view.tsx",
              duration: "0.2s",
              text: "Read the run list, elapsed-time labels, and captured transcript rendering.\n\nThe current viewer puts run IDs before useful information. Messages render as plain text.",
            },
            {
              kind: "tool",
              name: "bash",
              subject: "Viewer checks",
              duration: "2.1s",
              text: "$ bun run test:viewer\n\nSample check output for this prototype, not a real test run.\n12 checks passed.",
            },
            {
              role: "assistant",
              final: true,
              text: "The thread-style layout makes the task and result easier to read. The model and duration stay visible above the conversation.",
              bullets: [
                "Keep the model in each run row and in the selected run header.",
                "Separate execution status from capture coverage.",
                "Collapse tool output by default. Keep it available for inspection.",
              ],
              closing: "No blocking issues in this sample review.",
            },
          ],
        },
        {
          id: "inspect-capture",
          label: "Inspect capture metadata",
          agent: "Scout",
          model: "Claude Sonnet 4.6",
          provider: "Anthropic",
          state: "running",
          status: "Running",
          duration: "38s",
          timing: "Elapsed at capture",
          capture: "Captured at 14:33:06",
          runId: "sample_scout_02",
          task: "Check which model and timing fields are available for captured subagent runs. Do not edit the provider.",
          notice:
            "This is a captured observation, not a live feed. The agent was running when captured.",
          messages: [
            {
              role: "assistant",
              text: "I found start time, end time, and duration fields. Next I will check whether the capture includes the resolved model.",
            },
            {
              kind: "tool",
              name: "read",
              subject: "subagents-contract.ts",
              duration: "0.1s",
              text: "Timing fields: startedAt, endedAt, durationMs, observedAt.\nThe current ViewRow schema has no model field.",
            },
            {
              role: "assistant",
              text: "The viewer will need model data from the provider before it can show this value in the live app.",
            },
          ],
        },
        {
          id: "check-tests",
          label: "Check viewer tests",
          agent: "Worker",
          model: "GPT-5.4",
          provider: "OpenAI",
          state: "failed",
          status: "Failed",
          duration: "24s",
          timing: "Total duration",
          capture: "Captured at 14:31:42",
          runId: "sample_worker_03",
          task: "Run the viewer checks and report any failures. Do not change files.",
          notice:
            "Execution failed. The sample run could not start its test command. This is not a capture failure.",
          messages: [
            { role: "assistant", text: "I will run the targeted viewer checks." },
            {
              kind: "tool",
              name: "bash",
              subject: "Viewer checks",
              duration: "0.4s",
              failed: true,
              text: '$ bun run test:viewer\nerror: Script not found "test:viewer"\n\nSample failure for this prototype.',
            },
            {
              role: "assistant",
              text: "The test command failed because the sample script does not exist. No tests ran and no files changed.",
            },
          ],
        },
        {
          id: "partial-review",
          label: "Review narrow-panel layout",
          agent: "Reviewer",
          model: null,
          provider: null,
          state: "complete",
          status: "Complete",
          duration: null,
          timing: "Duration not captured",
          capture: "Last capture at 14:29:10",
          runId: "sample_review_04",
          task: "Review the viewer at narrow panel widths. Check long labels and keyboard access.",
          notice:
            "Capture is incomplete. The execution is known to be complete, but the final output and some messages were not captured.",
          incomplete: true,
          messages: [
            {
              role: "assistant",
              text: "I am checking long model names and the run-list keyboard controls.",
            },
            {
              kind: "tool",
              name: "read",
              subject: "Panel layout",
              duration: null,
              text: "Sample capture contains the start of the layout inspection only.\n\nThis tool result was truncated.",
              truncated: true,
            },
          ],
        },
      ];
      let selected = runs[0].id;
      const el = (id) => document.getElementById(id);
      // Keep the capture disclosure when replacing messages, including loading and empty states.
      const snapshot = el("snapshot-footer");
      const stateIcon = (run) =>
        run.state === "complete" ? "check" : run.state === "failed" ? "error" : "clock";
      // Both the sample parent thread and selected child use this conversation renderer.
      // This is a visual prototype, not BB's native thread renderer.
      function conversation(task, messages, agent, incomplete = false) {
        const taskMessage = `<article class="message user"><div class="message-meta"><strong>Task</strong><span>From parent</span></div><div class="message-body"><p>${escape(task)}</p></div></article>`;
        const body = messages
          .map((message) => {
            if (message.kind === "tool")
              return `<details class="tool"><summary>${icon("chevron")}<span class="tool-name">${escape(message.name)}</span><span>${escape(message.subject)}</span><span class="tool-time number ${message.failed ? "failed" : ""}">${message.failed ? "Failed" : escape(message.duration ?? "Time unavailable")}</span></summary><div class="tool-content"><pre>${escape(message.text)}</pre>${message.truncated ? '<p class="muted">Tool result truncated.</p>' : ""}</div></details>`;
            return `<article class="message assistant" ${message.final ? 'data-final="true"' : ""}><div class="message-meta"><strong>${escape(agent)}</strong><span>${message.final ? "Final output" : "Assistant"}</span></div>${message.final ? `<div class="final-caption">${icon("check")}Captured final output</div>` : ""}<div class="message-body"><p>${escape(message.text)}</p>${message.bullets ? `<ul>${message.bullets.map((text) => `<li>${escape(text)}</li>`).join("")}</ul>` : ""}${message.closing ? `<p>${escape(message.closing)}</p>` : ""}</div></article>`;
          })
          .join("");
        const missing = incomplete
          ? '<div class="notice"><strong>Final output not captured.</strong><br>Missing output does not change the known execution status. Some transcript entries were omitted.</div>'
          : "";
        return `<div class="conversation">${taskMessage}${body}${missing}</div>`;
      }
      function renderList() {
        el("run-count").textContent = "4 runs · 1 running";
        el("run-list").innerHTML = runs
          .map(
            (run) =>
              `<li><button type="button" class="run-button" data-run="${run.id}" aria-pressed="${run.id === selected}"><span class="state-mark ${run.state}">${icon(stateIcon(run))}</span><span><span class="run-name">${escape(run.label)}</span><span class="run-meta">${escape(run.agent)} · ${escape(run.model ?? "Model unavailable")}${run.incomplete ? " · Incomplete capture" : ""}</span></span><span class="run-status ${run.state}">${run.status}<span class="run-time number">${escape(run.duration ?? "Time unavailable")}${run.state === "running" ? " at capture" : ""}</span></span></button></li>`,
          )
          .join("");
        el("run-list").querySelector('[aria-pressed="true"]').scrollIntoView({ block: "nearest" });
      }
      function renderDetail() {
        const run = runs.find((item) => item.id === selected);
        const error = el("scenario").value === "error";
        el("detail-header").innerHTML =
          `<div class="detail-title"><h2>${escape(run.label)}</h2><span class="state-label ${run.state}">${icon(stateIcon(run))}${run.status}</span></div><dl class="metrics"><div><dt>Model</dt><dd>${escape(run.model ?? "Unavailable")}${run.provider ? `<br><small>${escape(run.provider)}</small>` : "<br><small>Not included in capture</small>"}</dd></div><div><dt>${escape(run.timing)}</dt><dd class="number">${escape(run.duration ?? "Unavailable")}</dd></div></dl>${run.incomplete ? '<p class="coverage-note">Incomplete capture · Final output unavailable</p>' : run.state === "running" ? '<p class="coverage-note">Captured observation, not a live feed</p>' : ""}`;
        el("transcript").innerHTML =
          `${error ? '<p class="notice" role="alert"><strong>Capture refresh failed.</strong> Previously captured detail stays visible. Select Captured runs above to leave this sample error state.</p>' : ""}${run.notice ? `<p class="notice">${escape(run.notice)}</p>` : ""}${conversation(run.task, run.messages, run.agent, run.incomplete)}`;
        el("transcript").append(snapshot);
        el("transcript").scrollTop = 0;
        el("jump").disabled = !run.messages.some((message) => message.final);
        el("jump").title = el("jump").disabled
          ? "No final output was captured for this run"
          : "Jump to captured final output";
        el("snapshot-label").textContent =
          `${run.capture} · ${run.incomplete ? "Incomplete capture" : "Snapshot"}`;
        el("capture-details").innerHTML =
          `<dt>Run ID</dt><dd><code>${escape(run.runId)}</code></dd><dt>Source</dt><dd>Sample background run</dd><dt>Coverage</dt><dd>${run.incomplete ? "Partial transcript. Final output unavailable." : "Illustrative messages, not real run history."}</dd><dt>Model data</dt><dd>${run.model ? "Illustrative resolved model. Not yet in ViewRow." : "No model captured. Not inferred from the parent."}</dd>`;
      }
      function render() {
        const scenario = el("scenario").value;
        const captured = scenario === "captured" || scenario === "error";
        el("run-list").hidden = !captured;
        el("list-state").hidden = captured;
        el("conversation-toolbar").hidden = !captured;
        snapshot.hidden = !captured;
        el("detail-header").hidden = !captured;
        if (captured) {
          renderList();
          renderDetail();
          return;
        }
        el("run-count").textContent = scenario === "loading" ? "Loading" : "0 runs";
        if (scenario === "loading") {
          el("list-state").innerHTML =
            '<div class="loading-runs" role="status" aria-label="Loading captured runs"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
          el("transcript").innerHTML =
            '<div class="state-content" role="status"><h2>Loading captured runs</h2><p>Reading the available observations for this thread.</p><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>';
        } else {
          el("list-state").innerHTML = '<div class="state-content">No runs</div>';
          el("transcript").innerHTML =
            '<div class="state-content"><h2>No subagent runs captured</h2><p>Captured runs appear here when this thread delegates work. Ordinary thread messages stay in the main conversation.</p><p style="margin-top:12px">Use the Data control to return to the sample runs.</p></div>';
        }
      }
      el("readonly").innerHTML = `${icon("lock")}Read-only`;
      el("picker-chevron").innerHTML = icon("chevron");
      el("snapshot-chevron").innerHTML = icon("chevron");
      el("jump-icon").innerHTML = icon("down");
      el("parent-content").innerHTML = conversation(
        "Prototype the viewer on the right. Use the same reading experience as threads, and make the model and elapsed time easier to see.",
        [
          {
            role: "assistant",
            text: "I will keep the run list above the selected conversation. Each run will show its model, status, and duration.",
          },
          {
            role: "assistant",
            text: "Select a run on the right to read its task, tool calls, and output. The same message layout is used in this sample thread and the subagent viewer.",
            bullets: [
              "Review viewer behavior has a captured final output.",
              "Inspect capture metadata is running at its last observation.",
              "Review narrow-panel layout is complete, but its capture is incomplete.",
            ],
          },
        ],
        "Pi",
      );
      el("run-list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-run]");
        if (!button || button.dataset.run === selected) return;
        selected = button.dataset.run;
        for (const item of el("run-list").querySelectorAll("button"))
          item.setAttribute("aria-pressed", String(item.dataset.run === selected));
        button.scrollIntoView({ block: "nearest" });
        renderDetail();
      });
      el("run-list").addEventListener("keydown", (event) => {
        const buttons = [...el("run-list").querySelectorAll("button")];
        const current = buttons.indexOf(event.target.closest("button"));
        if (current < 0) return;
        const next = {
          ArrowDown: Math.min(current + 1, buttons.length - 1),
          ArrowUp: Math.max(current - 1, 0),
          Home: 0,
          End: buttons.length - 1,
        }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        buttons[next].click();
        buttons[next].focus();
      });
      el("jump").addEventListener("click", () =>
        el("transcript")
          .querySelector("[data-final]")
          ?.scrollIntoView({
            behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth",
            block: "start",
          }),
      );
      el("width").addEventListener("change", (event) => {
        el("workspace").dataset.width = event.target.value;
      });
      el("scenario").addEventListener("change", render);
      el("theme").addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme !== "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        el("theme").setAttribute("aria-pressed", String(dark));
      });
      render();
    </script>
  </body>
</html>
